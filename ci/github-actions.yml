# Exchange UI Patrol - GitHub Actions CI/CD 配置
# 定时巡检 + 手动触发，支持多环境切换
#
# 使用方法：
# 1. 将此文件复制到 .github/workflows/patrol.yml
# 2. 在 GitHub 仓库 Settings → Secrets 中配置所需密钥
# 3. 定时任务将每30分钟自动执行，也可在 Actions 页面手动触发

name: Exchange UI Patrol

on:
  schedule:
    # 每30分钟执行一次巡检
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PATROL_ENV: ${{ github.event.inputs.environment || 'staging' }}
      PATROL_TEST_USERNAME: ${{ secrets.PATROL_TEST_USERNAME }}
      PATROL_TEST_PASSWORD: ${{ secrets.PATROL_TEST_PASSWORD }}
      PATROL_TOTP_SECRET: ${{ secrets.PATROL_TOTP_SECRET }}
      PATROL_DEVICE_ID: ${{ secrets.PATROL_DEVICE_ID }}
      PATROL_AUTH_TOKEN: ${{ secrets.PATROL_AUTH_TOKEN }}
      PATROL_WECOM_WEBHOOK_URL: ${{ secrets.PATROL_WECOM_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run patrol tests
        run: |
          pytest tests/ \
            -m "health_check or ui_elements" \
            --env=${{ env.PATROL_ENV }} \
            --alluredir=reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-report-${{ env.PATROL_ENV }}-${{ github.run_number }}
          path: reports/allure-results/
          retention-days: 30
