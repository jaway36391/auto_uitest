[project]
name = "exchange-ui-patrol"
version = "0.2.0"
description = "基于 Python + Playwright + browser-use + LLM API 的交易所 Web 页面 AI 驱动巡检测试框架"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "QA Team"}
]
readme = "README.md"

dependencies = [
    "playwright>=1.40",
    "pytest>=7.0",
    "pytest-playwright>=0.4",
    "pytest-asyncio>=0.23",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "allure-pytest>=2.13",
    "pyotp>=2.9",
    "browser-use>=0.9",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "openai>=1.0",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "mypy>=1.5",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "health_check: 页面可用性检测",
    "ui_elements: UI元素存在性验证",
    "critical_flow: 关键业务流程验证",
    "smoke: 冒烟测试（快速验证）",
    "prod_safe: 可安全在生产环境执行",
    "ai_driven: AI 驱动的自然语言测试",
]
addopts = "--strict-markers --alluredir=reports/allure-results"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
